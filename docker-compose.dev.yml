# ==============================================================================
# CareLink AI Healthcare Ecosystem — Development Docker Compose
# ==============================================================================

services:
  mongodb:
    image: mongo:7.0
    container_name: carelink-mongodb-dev
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=carelink
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - carelink-dev-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: carelink-backend-dev
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/carelink
      - JWT_SECRET=${JWT_SECRET:-carelink_super_secret_jwt_key_2024_healthcare_ai}
      - SESSION_SECRET=${SESSION_SECRET:-carelink_google_session_2024}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data_dev:/app/uploads
    networks:
      - carelink-dev-network
    depends_on:
      mongodb:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: carelink-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - carelink-dev-network
    depends_on:
      - backend

volumes:
  mongodb_data_dev:
    name: carelink_mongodb_data_dev
    driver: local
  uploads_data_dev:
    name: carelink_uploads_data_dev
    driver: local

networks:
  carelink-dev-network:
    name: carelink-dev-network
    driver: bridge
