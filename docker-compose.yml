# ==============================================================================
# CareLink AI Healthcare Ecosystem — Production Docker Compose
# ==============================================================================

services:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. MongoDB Database Container
  # ────────────────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: carelink-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=carelink
    volumes:
      - mongodb_data:/data/db
    networks:
      - carelink-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Backend API Service (Node.js / Express)
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carelink-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/carelink
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:5000/auth/google/callback}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - carelink-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Frontend Web Service (Nginx)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: carelink-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - carelink-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ──────────────────────────────────────────────────────────────────────────────
# Persistent Volumes & Networks
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
    name: carelink_mongodb_data
    driver: local
  uploads_data:
    name: carelink_uploads_data
    driver: local

networks:
  carelink-network:
    name: carelink-network
    driver: bridge
