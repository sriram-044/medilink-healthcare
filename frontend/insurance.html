<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareLink — Insurance Portal</title>
  <meta name="description" content="CareLink Insurance Portal: Policy claims verification, document checks, and cashless approvals." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">🛡️</div>
        <div>
          <div class="logo-text">MediLink AI</div>
          <div class="logo-subtitle">Insurance Portal</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a class="nav-item active" href="#">
          <span class="nav-icon">🛡️</span> Claims & Verification
        </a>
      </nav>
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebarAvatar">I</div>
        <div class="user-info">
          <div class="user-name" id="sidebarName">Insurance Officer</div>
          <div class="user-role">insurance</div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Logout">⏻</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div>
          <div class="topbar-title">🛡️ Health Insurance Claims & Verification</div>
          <div class="topbar-subtitle">Authorized medical dossiers & claim approval queue</div>
        </div>
      </div>

      <div class="page-content">
        <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 20px;">
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--primary),var(--secondary));">
            <div class="stat-icon">📄</div>
            <div class="stat-value" id="statTotalClaims">0</div>
            <div class="stat-label">Total Claims</div>
          </div>
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--warning),#e17055);">
            <div class="stat-icon">⏳</div>
            <div class="stat-value" id="statPendingClaims" style="color:var(--warning)">0</div>
            <div class="stat-label">Pending Verification</div>
          </div>
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--status-normal),#00b894);">
            <div class="stat-icon">✅</div>
            <div class="stat-value" id="statApprovedClaims" style="color:var(--status-normal)">0</div>
            <div class="stat-label">Approved Claims</div>
          </div>
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--danger),#c0392b);">
            <div class="stat-icon">❌</div>
            <div class="stat-value" id="statRejectedClaims" style="color:var(--danger)">0</div>
            <div class="stat-label">Rejected / Flagged</div>
          </div>
        </div>

        <div class="card mb-20">
          <div class="card-header">
            <div class="card-title">🛡️ Insurance Claims Queue</div>
            <button class="btn btn-ghost btn-sm" onclick="loadInsuranceClaims()">↻ Refresh Queue</button>
          </div>
          <div id="claimsList" style="display:flex; flex-direction:column; gap:14px;">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <link rel="stylesheet" href="components/carelink-ai/ai-chat.css" />
  <script src="components/carelink-ai/ai-config.js"></script>
  <script src="components/carelink-ai/ai-chat.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/insurance.js"></script>
</body>
</html>
