server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root static files
    root /usr/share/nginx/html;
    index pages/index.html index.html;

    # Frontend pages (supports both root and /pages/ structure)
    location / {
        try_files $uri $uri/ /pages$uri /pages/$uri /pages/index.html /index.html;
    }

    # Modular JS subfolder resolution fallback for legacy flat requests
    location ~ ^/js/([^/]+)\.js$ {
        try_files $uri /js/$1/$1.js /js/auth/$1.js /js/core/$1.js /js/laboratory/$1.js /js/ai-assistant/$1.js =404;
    }

    location /js/ {
        try_files $uri $uri/ =404;
    }

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy OAuth routes to backend container
    location /auth/ {
        proxy_pass http://backend:5000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Uploads requests to backend container
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check for Nginx
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"frontend-nginx"}';
        add_header Content-Type application/json;
    }
}
